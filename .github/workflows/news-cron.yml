name: ProducerToy News Auto Sync

on:
  schedule:
    # Runs every 1 hour (At minute 0 of every hour)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  sync-news:
    name: Fetch & Sync Latest News
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger ProducerToy News Sync
        run: |
          echo "Triggering ProducerToy news sync at $(date -u)..."
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 55 -X GET "https://producertoy.com/api/news/sync?limit=2" -H "User-Agent: GitHub-Actions-NewsCron/1.0")
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body:"
          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "⚠️ First attempt received status $HTTP_STATUS. Waiting 5s and retrying with limit=1..."
            sleep 5
            RETRY_RESP=$(curl -s -w "\n%{http_code}" --max-time 50 -X GET "https://producertoy.com/api/news/sync?limit=1" -H "User-Agent: GitHub-Actions-NewsCron/1.0")
            RETRY_BODY=$(echo "$RETRY_RESP" | sed '$d')
            RETRY_STATUS=$(echo "$RETRY_RESP" | tail -n1)

            echo "Retry HTTP Status Code: $RETRY_STATUS"
            echo "Retry Response Body:"
            echo "$RETRY_BODY"

            if [ "$RETRY_STATUS" -ne 200 ]; then
              echo "❌ News sync request failed with status $RETRY_STATUS"
              exit 1
            fi
          fi

          echo "✅ News sync completed successfully!"
